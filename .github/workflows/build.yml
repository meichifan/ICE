name: Build ICE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 出可侧载的未签名 IPA
  ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          xcodebuild -project ICE.xcodeproj \
            -scheme ICE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ICE.app Payload/
          zip -r ICE.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ICE-ipa
          path: ICE.ipa
          retention-days: 30

  # 在 iOS 模拟器里真跑起来并截图 —— 用来在没有 Mac 的情况下验收画面
  preview:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot an iOS simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "\([0-9A-F-]{36}\)" | tr -d '()')
          echo "SIM=$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          xcodebuild -project ICE.xcodeproj \
            -scheme ICE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Install, launch and screenshot
        run: |
          set -e
          APP=build-sim/Build/Products/Debug-iphonesimulator/ICE.app
          xcrun simctl install "$SIM_UDID" "$APP"

          run_mode () {
            NAME="$1"
            EXTRA="$2"
            xcrun simctl terminate "$SIM_UDID" com.ice.app 2>/dev/null || true
            sleep 1
            # 后台挂着 console 抓 App 的 stderr 日志（macOS 没有 timeout 命令，用 kill 控制）
            env $EXTRA SIMCTL_CHILD_ICE_AUTODRAG=1 SIMCTL_CHILD_ICE_DIAG=1 \
              xcrun simctl launch --console "$SIM_UDID" com.ice.app \
              > "console-$NAME.log" 2>&1 &
            CONSOLE_PID=$!
            sleep 5
            xcrun simctl io "$SIM_UDID" screenshot "$NAME-1.png" || true
            sleep 1
            xcrun simctl io "$SIM_UDID" screenshot "$NAME-2.png" || true
            sleep 2
            xcrun simctl io "$SIM_UDID" screenshot "$NAME-3.png" || true
            sleep 2
            xcrun simctl io "$SIM_UDID" screenshot "$NAME-4.png" || true
            kill "$CONSOLE_PID" 2>/dev/null || true
            sleep 1
          }

          run_mode normal ""
          run_mode solid "SIMCTL_CHILD_ICE_SOLID=1"

          ls -la *.png *.log || true
          echo "===== console normal ====="; cat console-normal.log || true
          echo "===== console solid ====="; cat console-solid.log || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ICE-screenshots
          path: |
            *.png
            *.log
          retention-days: 14
