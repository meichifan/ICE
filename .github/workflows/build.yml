name: Build ICE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 出可侧载的未签名 IPA
  ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          xcodebuild -project ICE.xcodeproj \
            -scheme ICE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ICE.app Payload/
          zip -r ICE.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ICE-ipa
          path: ICE.ipa
          retention-days: 30

  # 在 iOS 模拟器里真跑起来并截图 —— 用来在没有 Mac 的情况下验收画面
  preview:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot an iOS simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "\([0-9A-F-]{36}\)" | tr -d '()')
          echo "SIM=$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          xcodebuild -project ICE.xcodeproj \
            -scheme ICE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Install, launch and screenshot
        run: |
          set -e
          APP=build-sim/Build/Products/Debug-iphonesimulator/ICE.app
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.ice.app
          sleep 8
          xcrun simctl io "$SIM_UDID" screenshot shot-launch.png
          # 拖动一下，看看惯性/旋转后的样子
          xcrun simctl io "$SIM_UDID" screenshot shot-1.png
          sleep 2
          xcrun simctl io "$SIM_UDID" screenshot shot-2.png
          ls -la *.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ICE-screenshots
          path: shot-*.png
          retention-days: 14
